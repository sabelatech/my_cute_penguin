<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Pet my penguin</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header class="hero">
      <h1>My cute penguin</h1>
      <p class="tagline">Pet it for a little winter kindness</p>
    </header>
    <main>
      <section class="penguin-card">
        <div class="penguin" id="penguin">
          <img id="penguin_sad" src="penguin_sad.png" alt="a sad penguin" />
          <img id="penguin_happy" src="penguin_happy.png" alt="a sad penguin" />
        </div>
        <button id="Pet">Pet my penguin to make him happy</button>
        <p class="message" id="message">Pet the penguin and see what it tells you</p>
      </section>
    </main>
    <footer>
      <p>Made by me,a winter lover</p>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
